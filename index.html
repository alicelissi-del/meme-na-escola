<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Memes</title>
  <style>
    body {
      background-color: rgb(76, 83, 87);    /* Cor de fundo */
      color: rgb(25, 100, 119);               /* Cor do texto */
      font-family: sans-serif;    /* Tipo de fonte */
      text-align: center;         /* Alinhamento do texto */
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      color: rgb(18, 74, 100);              /* Cor do título */
    }

    img {
      width: 350px;               /* Largura da imagem */
      border: 5px solid rgb(0, 0, 0);   /* Borda da imagem */
      border-radius: 15px;        /* Bordas arredondadas */
    }

    p {
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1> "Eu indo para escola segunda-feira"</h1>

  <!-- Cole o link da imagem dentro das aspas do src abaixo -->
  <img src=" https://t.ctcdn.com.br/X4Ak-IqP8dDtQTgnzRci9BRYHxw=/1200x675/smart/i662596.jpeg">

  <p> "Eu voltando para casa na sexta-feira"</p>

</body>
</html>
